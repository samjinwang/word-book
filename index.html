<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>단어장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f3f7; color: #333; }

    header {
      position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #e0e0e0;
      display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; z-index: 100;
    }
    .header-btn { background: none; border: none; font-size: 16px; font-weight: 600; color: #007aff; cursor: pointer; }
    #header-title { font-size: 17px; font-weight: 700; }

    #page-selection-view { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .page-btn {
      background: #ffffff; border: 1px solid #ddd; border-radius: 12px; padding: 20px 12px;
      font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .page-btn span.count { font-size: 12px; font-weight: normal; color: #888; }

    #word-study-view { display: none; padding: 16px; flex-direction: column; align-items: center; gap: 14px; }
    
    .card-container {
      width: 100%; max-width: 380px; height: 140px; perspective: 1000px;
    }
    .card {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.35s ease; border-radius: 14px; cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; border: 1px solid #e5e5ea;
    }
    .card-front { background: #ffffff; color: #1c1c1e; font-size: 21px; font-weight: 700; }
    .card-back { background: #007aff; color: #ffffff; font-size: 18px; font-weight: 600; transform: rotateY(180deg); }

    #loading-msg { text-align: center; padding: 40px; font-size: 15px; color: #666; width: 100%; grid-column: span 2; }
  </style>
</head>
<body>

  <header>
    <button id="back-btn" class="header-btn" style="display: none;" onclick="showPageList()">← 목록</button>
    <div id="header-title">단어장 선택</div>
    <button id="shuffle-btn" class="header-btn" style="display: none;" onclick="shuffleCurrentWords()">셔플</button>
  </header>

  <main id="page-selection-view">
    <div id="loading-msg">단어 목록을 불러오는 중...</div>
  </main>
  <main id="word-study-view"></main>

  <script>
    let wordData = {};
    let currentPageKey = null;
    let currentWords = [];

    const pageListView = document.getElementById("page-selection-view");
    const studyView = document.getElementById("word-study-view");
    const headerTitle = document.getElementById("header-title");
    const backBtn = document.getElementById("back-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");

    // words.json 비동기 로드
    fetch('./words.json')
      .then(res => {
        if (!res.ok) throw new Error("네트워크 응답 오류");
        return res.json();
      })
      .then(data => {
        wordData = data;
        renderPageSelection();
      })
      .catch(err => {
        pageListView.innerHTML = `<div id="loading-msg" style="color:red;">words.json 파일을 불러오지 못했습니다.<br>경로와 JSON 형식을 확인해주세요.</div>`;
      });

    // 페이지 버튼 자동 생성
    function renderPageSelection() {
      pageListView.innerHTML = "";
      const pageKeys = Object.keys(wordData);

      pageKeys.forEach(pageKey => {
        const btn = document.createElement("button");
        btn.className = "page-btn";
        btn.innerHTML = `${pageKey} <span class="count">${wordData[pageKey].length}단어</span>`;
        btn.onclick = () => loadPage(pageKey);
        pageListView.appendChild(btn);
      });
    }

    function loadPage(pageKey) {
      currentPageKey = pageKey;
      currentWords = [...wordData[pageKey]];

      headerTitle.textContent = pageKey;
      pageListView.style.display = "none";
      studyView.style.display = "flex";
      backBtn.style.display = "block";
      shuffleBtn.style.display = "block";

      renderCards(currentWords);
      window.scrollTo(0, 0);
    }

    function renderCards(words) {
      studyView.innerHTML = "";
      words.forEach(item => {
        const container = document.createElement("div");
        container.className = "card-container";

        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => card.classList.toggle("flipped");

        const front = document.createElement("div");
        front.className = "card-face card-front";
        front.textContent = item.en;

        const back = document.createElement("div");
        back.className = "card-face card-back";
        back.textContent = item.ko;

        card.appendChild(front);
        card.appendChild(back);
        container.appendChild(card);
        studyView.appendChild(container);
      });
    }

    function shuffleCurrentWords() {
      for (let i = currentWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
      }
      renderCards(currentWords);
    }

    function showPageList() {
      currentPageKey = null;
      headerTitle.textContent = "단어장 선택";
      pageListView.style.display = "grid";
      studyView.style.display = "none";
      backBtn.style.display = "none";
      shuffleBtn.style.display = "none";
      studyView.innerHTML = "";
    }
  </script>
</body>
</html>
