<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>단어장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --word-size: 38px;
      --meaning-size: 30px;
      --both-word-size: 24px;
      --both-meaning-size: 20px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #222; }

    /* 상단 헤더 */
    header {
      position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #e2e5ec;
      display: flex; flex-direction: column; padding: 10px 12px; z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04); gap: 8px;
    }
    .header-top {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }
    .header-actions {
      display: flex; gap: 8px; align-items: center; overflow-x: auto; width: 100%; padding-bottom: 2px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .header-actions::-webkit-scrollbar { display: none; }
    
    /* 헤더 버튼 스타일 개선 및 간격 확보 */
    .header-btn {
      background: #f0f2f7; border: 1.5px solid #d5d9e2; font-size: 13.5px; font-weight: 700; color: #2c3038;
      cursor: pointer; padding: 8px 12px; border-radius: 10px; display: inline-flex; align-items: center;
      justify-content: center; transition: all 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      user-select: none; white-space: nowrap; flex-shrink: 0;
    }
    .header-btn:active { background: #e0e4ec; transform: scale(0.96); }
    
    #back-btn { background: #f2f7ff; border-color: #c2daf8; color: #007aff; }

    /* 글자 크기 조절 버튼 그룹 */
    .font-ctrl-group { display: inline-flex; gap: 4px; flex-shrink: 0; }
    .font-btn { padding: 8px 10px; font-size: 13px; }

    .header-btn.active {
      background: #ff7b90; border-color: #f26279; color: #ffffff;
      box-shadow: 0 2px 6px rgba(255, 123, 144, 0.35);
    }

    #header-title {
      font-size: 17px; font-weight: 800; text-align: center; flex: 1; margin: 0 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111;
    }

    /* 메인 선택 메뉴 */
    #page-selection-view { padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; }
    
    .all-starred-btn {
      background: linear-gradient(135deg, #ff8da1, #ff6b8b); color: #ffffff;
      border: none; border-radius: 16px; padding: 22px 18px; font-size: 20px; font-weight: 800;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.3); transition: transform 0.15s;
    }
    .all-starred-btn:active { transform: scale(0.98); }
    .all-starred-btn span.badge {
      background: rgba(255, 255, 255, 0.35); padding: 6px 12px; border-radius: 20px; font-size: 16px; font-weight: 700;
    }

    .page-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .page-btn {
      background: #ffffff; border: 1.5px solid #dce0e8; border-radius: 16px; padding: 24px 12px;
      font-size: 19px; font-weight: 800; color: #1c1c1e; cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; align-items: center; gap: 8px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .page-btn:active { transform: scale(0.97); border-color: #ff7b90; }
    .page-btn span.count { font-size: 14px; font-weight: 600; color: #8a8e99; }

    /* 단어 학습 컨테이너 */
    #word-study-view { display: none; padding: 16px 8px; flex-direction: column; align-items: center; gap: 16px; min-height: 80vh; width: 100%; }
    
    /* 1) 뒤집기(플립) 모드 컨테이너 */
    .flip-container { width: 100%; max-width: 440px; height: 195px; perspective: 1000px; padding: 0 6px; }
    .card {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 20px; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    .card.flipped { transform: rotateY(180deg); }
    
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px 20px; text-align: center; border: 1.5px solid #e1e4ec; position: relative;
    }

    /* 2) 단어+뜻 독립 2카드 나란히 배치 컨테이너 */
    .both-row-container {
      width: 100%; max-width: 760px; display: flex; gap: 8px; align-items: stretch; padding: 0 4px;
    }
    .side-card {
      flex: 1; min-height: 180px; border-radius: 18px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 14px 10px; text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05); position: relative;
    }

    /* 카드 내부 중앙정렬 콘텐츠 래퍼 */
    .card-content-center {
      display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;
    }

    /* 영어 카드 (앞면 / 독립카드) */
    .eng-face { background: #ffffff; color: #1c1c1e; border: 1.5px solid #e1e4ec; }
    .eng-face .word { 
      font-size: var(--word-size); font-weight: 800; line-height: 1.15; word-break: break-word; letter-spacing: -0.5px;
    }
    /* 발음기호 크기 확대 */
    .eng-face .pron { font-size: 18px; color: #6e7380; margin-top: 8px; font-weight: 500; }

    /* 한글 카드 (뒷면 / 독립카드) - 부드러운 로즈/핑크 톤 */
    .kor-face {
      background: linear-gradient(135deg, #ff8da1, #f97794); color: #ffffff;
      border: 1.5px solid #ff758f;
    }
    .card-back { transform: rotateY(180deg); }
    
    /* 품사 배지 */
    .kor-face .pos-badge {
      display: inline-block; background: rgba(255, 255, 255, 0.28); color: #ffffff;
      padding: 3px 10px; border-radius: 8px; font-size: 15px; font-weight: 700; margin-bottom: 8px;
    }
    .kor-face .meaning { 
      font-size: var(--meaning-size); font-weight: 800; line-height: 1.25; word-break: keep-all; letter-spacing: -0.5px;
    }

    /* 단어+뜻 모드에서의 폰트 크기 세밀 조정 */
    .side-card.eng-face .word { font-size: var(--both-word-size); }
    .side-card.eng-face .pron { font-size: 16px; margin-top: 6px; }
    .side-card.kor-face .pos-badge { font-size: 13px; padding: 2px 8px; margin-bottom: 6px; }
    .side-card.kor-face .meaning { font-size: var(--both-meaning-size); }

    /* 별표 버튼 */
    .star-icon {
      position: absolute; top: 10px; right: 12px; font-size: 28px; line-height: 1;
      cursor: pointer; user-select: none; z-index: 10; padding: 4px;
    }
    .eng-face .star-icon { color: #d0d4dd; }
    .eng-face .star-icon.starred { color: #ff9500; }
    .kor-face .star-icon { color: rgba(255, 255, 255, 0.45); }
    .kor-face .star-icon.starred { color: #fff382; text-shadow: 0 0 4px rgba(0,0,0,0.15); }

    .empty-msg { text-align: center; padding: 70px 20px; font-size: 18px; font-weight: 600; color: #8e8e93; }
    #loading-msg { text-align: center; padding: 50px; font-size: 18px; font-weight: 600; color: #8e8e93; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <button id="back-btn" class="header-btn" style="display: none;" onclick="showPageList()">← 목록</button>
      <div id="header-title">단어장 선택</div>
      <div style="width: 50px;" id="header-spacer"></div>
    </div>
    <div class="header-actions" id="header-actions" style="display: none;">
      <button id="both-mode-btn" class="header-btn" onclick="toggleBothMode()">단어+뜻</button>
      <div id="font-ctrl" class="font-ctrl-group">
        <button class="header-btn font-btn" onclick="adjustFontSize(-1)">가-</button>
        <button class="header-btn font-btn" onclick="adjustFontSize(1)">가+</button>
      </div>
      <button id="star-filter-btn" class="header-btn" onclick="toggleStarFilter()">★만 보기</button>
      <button id="shuffle-btn" class="header-btn" onclick="shuffleCurrentWords()">셔플</button>
    </div>
  </header>

  <main id="page-selection-view">
    <div id="loading-msg">단어 목록을 불러오는 중...</div>
  </main>

  <main id="word-study-view"></main>

  <script>
    let wordData = {};
    let currentPageKey = null;
    let baseWords = [];
    let displayWords = [];
    let isStarOnly = false;
    let isAllStarredMode = false;
    let isBothMode = false;

    // 단계별 글자 크기 정의
    const fontSizes = [
      { word: "26px", meaning: "22px", bWord: "18px", bMeaning: "16px" },
      { word: "32px", meaning: "26px", bWord: "21px", bMeaning: "18px" },
      { word: "38px", meaning: "30px", bWord: "24px", bMeaning: "20px" }, // 기본
      { word: "44px", meaning: "34px", bWord: "27px", bMeaning: "22px" },
      { word: "50px", meaning: "38px", bWord: "30px", bMeaning: "24px" },
      { word: "56px", meaning: "42px", bWord: "33px", bMeaning: "26px" }
    ];
    let currentFontLevel = parseInt(localStorage.getItem('word_font_level') || '2', 10);
    let starredSet = new Set(JSON.parse(localStorage.getItem('starred_words') || '[]'));

    const pageListView = document.getElementById("page-selection-view");
    const studyView = document.getElementById("word-study-view");
    const headerTitle = document.getElementById("header-title");
    const headerActions = document.getElementById("header-actions");
    const headerSpacer = document.getElementById("header-spacer");
    const backBtn = document.getElementById("back-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const starFilterBtn = document.getElementById("star-filter-btn");
    const bothModeBtn = document.getElementById("both-mode-btn");

    applyFontSize();

    fetch('./words.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error("JSON 읽기 오류");
        return res.json();
      })
      .then(data => {
        wordData = data;
        renderPageSelection();
      })
      .catch(err => {
        pageListView.innerHTML = `<div id="loading-msg" style="color:#ff3b30;">words.json 파일을 불러오지 못했습니다.<br>경로와 내용을 확인해주세요.</div>`;
      });

    function applyFontSize() {
      const config = fontSizes[currentFontLevel];
      document.documentElement.style.setProperty('--word-size', config.word);
      document.documentElement.style.setProperty('--meaning-size', config.meaning);
      document.documentElement.style.setProperty('--both-word-size', config.bWord);
      document.documentElement.style.setProperty('--both-meaning-size', config.bMeaning);
      localStorage.setItem('word_font_level', currentFontLevel);
    }

    function adjustFontSize(delta) {
      currentFontLevel += delta;
      if (currentFontLevel < 0) currentFontLevel = 0;
      if (currentFontLevel >= fontSizes.length) currentFontLevel = fontSizes.length - 1;
      applyFontSize();
    }

    function saveStarred() {
      localStorage.setItem('starred_words', JSON.stringify([...starredSet]));
    }

    function renderPageSelection() {
      pageListView.innerHTML = "";

      let totalStarredCount = 0;
      Object.values(wordData).forEach(list => {
        list.forEach(item => {
          if (starredSet.has(item.en)) totalStarredCount++;
        });
      });

      const allStarredBtn = document.createElement("button");
      allStarredBtn.className = "all-starred-btn";
      allStarredBtn.innerHTML = `
        <span>★ 별표 친 단어 모두 모아보기</span>
        <span class="badge">${totalStarredCount}개</span>
      `;
      allStarredBtn.onclick = () => loadAllStarred();
      pageListView.appendChild(allStarredBtn);

      const grid = document.createElement("div");
      grid.className = "page-grid";

      Object.keys(wordData).forEach(pageKey => {
        const btn = document.createElement("button");
        btn.className = "page-btn";
        btn.innerHTML = `${pageKey} <span class="count">${wordData[pageKey].length}단어</span>`;
        btn.onclick = () => loadPage(pageKey);
        grid.appendChild(btn);
      });

      pageListView.appendChild(grid);
    }

    function loadPage(pageKey) {
      currentPageKey = pageKey;
      isAllStarredMode = false;
      isStarOnly = false;
      isBothMode = false;
      baseWords = [...wordData[pageKey]];
      displayWords = [...baseWords];

      updateHeader(pageKey);
      renderCards(displayWords);
      window.scrollTo(0, 0);
    }

    function loadAllStarred() {
      currentPageKey = "별표 모아보기";
      isAllStarredMode = true;
      isStarOnly = true;
      isBothMode = false;

      baseWords = [];
      Object.values(wordData).forEach(list => {
        list.forEach(item => {
          if (starredSet.has(item.en)) {
            baseWords.push(item);
          }
        });
      });
      displayWords = [...baseWords];

      updateHeader("★ 별표 모아보기");
      starFilterBtn.style.display = "none";
      renderCards(displayWords);
      window.scrollTo(0, 0);
    }

    function updateHeader(title) {
      headerTitle.textContent = title;
      pageListView.style.display = "none";
      studyView.style.display = "flex";
      backBtn.style.display = "inline-flex";
      headerSpacer.style.display = "none";
      headerActions.style.display = "flex";

      bothModeBtn.classList.remove("active");
      bothModeBtn.textContent = "단어+뜻";

      starFilterBtn.style.display = isAllStarredMode ? "none" : "inline-flex";
      starFilterBtn.classList.remove("active");
      starFilterBtn.textContent = "★만 보기";
    }

    function toggleBothMode() {
      isBothMode = !isBothMode;
      if (isBothMode) {
        bothModeBtn.classList.add("active");
        bothModeBtn.textContent = "뒤집기 모드";
      } else {
        bothModeBtn.classList.remove("active");
        bothModeBtn.textContent = "단어+뜻";
      }
      renderCards(displayWords);
    }

    function renderCards(words) {
      studyView.innerHTML = "";

      if (words.length === 0) {
        studyView.innerHTML = `<div class="empty-msg">별표 친 단어가 없습니다.</div>`;
        return;
      }

      words.forEach(item => {
        const isStarred = starredSet.has(item.en);

        if (isBothMode) {
          // [2] 단어+뜻 모드: 2개의 독립 카드가 나란히 배치됨
          const rowContainer = document.createElement("div");
          rowContainer.className = "both-row-container";

          // 왼쪽 영어 카드
          const leftCard = document.createElement("div");
          leftCard.className = "side-card eng-face";
          leftCard.innerHTML = `
            <div class="star-icon ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.en}')">
              ${isStarred ? '★' : '☆'}
            </div>
            <div class="card-content-center">
              <div class="word">${item.en}</div>
              ${item.pron ? `<div class="pron">${item.pron}</div>` : ''}
            </div>
          `;

          // 오른쪽 한글 카드 (부드러운 로즈 핑크)
          const rightCard = document.createElement("div");
          rightCard.className = "side-card kor-face";
          rightCard.innerHTML = `
            <div class="card-content-center">
              ${item.pos ? `<span class="pos-badge">${item.pos}</span>` : ''}
              <div class="meaning">${item.ko}</div>
            </div>
          `;

          rowContainer.appendChild(leftCard);
          rowContainer.appendChild(rightCard);
          studyView.appendChild(rowContainer);

        } else {
          // [1] 뒤집기 모드: 터치 시 플립
          const container = document.createElement("div");
          container.className = "flip-container";

          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => card.classList.toggle("flipped");

          // 앞면 (영어 & 발음기호 중앙정렬)
          const front = document.createElement("div");
          front.className = "card-face eng-face";
          front.innerHTML = `
            <div class="star-icon ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.en}')">
              ${isStarred ? '★' : '☆'}
            </div>
            <div class="card-content-center">
              <div class="word">${item.en}</div>
              ${item.pron ? `<div class="pron">${item.pron}</div>` : ''}
            </div>
          `;

          // 뒷면 (품사 & 한글뜻 중앙정렬)
          const back = document.createElement("div");
          back.className = "card-face kor-face card-back";
          back.innerHTML = `
            <div class="star-icon ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.en}')">
              ${isStarred ? '★' : '☆'}
            </div>
            <div class="card-content-center">
              ${item.pos ? `<span class="pos-badge">${item.pos}</span>` : ''}
              <div class="meaning">${item.ko}</div>
            </div>
          `;

          card.appendChild(front);
          card.appendChild(back);
          container.appendChild(card);
          studyView.appendChild(container);
        }
      });
    }

    function toggleStar(event, wordEn) {
      event.stopPropagation();

      if (starredSet.has(wordEn)) {
        starredSet.delete(wordEn);
      } else {
        starredSet.add(wordEn);
      }
      saveStarred();

      if (isStarOnly) {
        displayWords = displayWords.filter(item => starredSet.has(item.en));
        renderCards(displayWords);
      } else {
        renderCards(displayWords);
      }
    }

    function toggleStarFilter() {
      isStarOnly = !isStarOnly;
      if (isStarOnly) {
        starFilterBtn.classList.add("active");
        starFilterBtn.textContent = "전체보기";
        displayWords = baseWords.filter(item => starredSet.has(item.en));
      } else {
        starFilterBtn.classList.remove("active");
        starFilterBtn.textContent = "★만 보기";
        displayWords = [...baseWords];
      }
      renderCards(displayWords);
    }

    function shuffleCurrentWords() {
      for (let i = displayWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [displayWords[i], displayWords[j]] = [displayWords[j], displayWords[i]];
      }
      renderCards(displayWords);
    }

    function showPageList() {
      currentPageKey = null;
      isBothMode = false;
      headerTitle.textContent = "단어장 선택";
      pageListView.style.display = "flex";
      studyView.style.display = "none";
      backBtn.style.display = "none";
      headerActions.style.display = "none";
      headerSpacer.style.display = "block";
      studyView.innerHTML = "";
      renderPageSelection();
    }
  </script>
</body>
</html>
